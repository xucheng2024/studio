name: Free cloud UAT

on:
  workflow_dispatch:
    inputs:
      flow:
        description: "One isolated UAT flow, or all flows in parallel"
        required: true
        default: apt04-appointments-local
        type: choice
        options:
          - apt01-availability-local
          - apt03-calendar-local
          - apt04-appointments-local
          - apt04-settlement-sandbox-local
          - com01-commission-local
          - crm02-clients-local
          - cmp01-privacy-local
          - mkt01-marketing-local
          - mkt02-studio-email-local
          - pay01-payroll-local
          - pos02-cash-receipt-local
          - pos03-hitpay-sandbox-local
          - pkg01-package-ledger-local
          - pos-packages-local
          - public-commerce-local
          - ops-board-local
          - all
          - all-batched

permissions:
  contents: read

jobs:
  isolated-uat:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        flow: ${{ fromJSON(inputs.flow == 'all' && '["apt01-availability-local","apt03-calendar-local","apt04-appointments-local","apt04-settlement-sandbox-local","com01-commission-local","crm02-clients-local","cmp01-privacy-local","mkt01-marketing-local","mkt02-studio-email-local","pay01-payroll-local","pos02-cash-receipt-local","pos03-hitpay-sandbox-local","pkg01-package-ledger-local","pos-packages-local","public-commerce-local","ops-board-local"]' || inputs.flow == 'all-batched' && '["all-batched"]' || format('["{0}"]', inputs.flow)) }}
    concurrency:
      group: free-cloud-uat-${{ github.ref }}-${{ matrix.flow }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.flow == 'all-batched' && 50 || 15 }}
    steps:
      - name: Check out reviewed repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          npm ci --prefer-offline --no-audit --fund=false

      - name: Restore Chromium browser cache
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-x64-playwright-${{ hashFiles('package-lock.json') }}

      - name: Probe cached Chromium runtime
        id: chromium-runtime
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: >-
          node --input-type=module -e 'import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true }); await browser.close();'

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true' && steps.chromium-runtime.outcome == 'failure'
        run: npx playwright install-deps chromium

      - name: Save Chromium browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && (inputs.flow != 'all' || matrix.flow == 'apt04-appointments-local')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-x64-playwright-${{ hashFiles('package-lock.json') }}

      - name: Resolve Supabase cache version
        id: supabase-version
        run: >-
          node -e 'const fs = require("node:fs"); const lock = require("./package-lock.json");
          const version = lock.packages?.["node_modules/supabase"]?.version;
          if (!/^\d+\.\d+\.\d+/.test(version ?? "")) throw new Error("Missing exact Supabase CLI version");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'

      - name: Restore Supabase image cache
        id: supabase-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/github-uat/supabase-images.tar
          key: ${{ runner.os }}-x64-supabase-${{ steps.supabase-version.outputs.version }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Supabase images
        if: steps.supabase-cache.outputs.cache-hit == 'true'
        run: node scripts/cache-github-uat-images.mjs restore

      - name: Run isolated Docker-backed UAT
        env:
          SELECTED_FLOW: ${{ matrix.flow }}
          UAT_SUPABASE_EXCLUDE: realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          POS03_HITPAY_API_KEY: ${{ secrets.POS03_HITPAY_API_KEY }}
          POS03_HITPAY_WEBHOOK_SALT: ${{ secrets.POS03_HITPAY_WEBHOOK_SALT }}
          HITPAY_API_BASE_URL: https://api.sandbox.hit-pay.com
        run: node scripts/run-github-hosted-uat.mjs --flow "$SELECTED_FLOW"

      - name: Export Supabase images for cache
        id: supabase-cache-export
        if: always() && steps.supabase-cache.outputs.cache-hit != 'true' && (inputs.flow != 'all' || matrix.flow == 'apt04-appointments-local')
        run: |
          node scripts/cache-github-uat-images.mjs save
          if [[ -f .cache/github-uat/supabase-images.tar ]]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Supabase image cache
        if: always() && steps.supabase-cache.outputs.cache-hit != 'true' && steps.supabase-cache-export.outputs.created == 'true' && (inputs.flow != 'all' || matrix.flow == 'apt04-appointments-local')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/github-uat/supabase-images.tar
          key: ${{ runner.os }}-x64-supabase-${{ steps.supabase-version.outputs.version }}-${{ hashFiles('supabase/config.toml') }}
