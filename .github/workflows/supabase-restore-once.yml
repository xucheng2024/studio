# Restore old_project.dump into a Supabase database (one-off).
#
# Secret: SUPABASE_TARGET_DB_PASSWORD — Database password for the TARGET project only
#
# Inputs:
#   target_project_ref — Reference ID only, e.g. yjupnmbrpqeuyxgrpsrb (NOT postgres.yjupnmbrpqeuyxgrpsrb)
#   pooler_host — from Connect → Session pooler, e.g. aws-1-ap-northeast-1.pooler.supabase.com

name: Supabase DB restore (one-off)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the successful dump job (number in Actions URL)"
        required: true
        type: string
      target_project_ref:
        description: "Target project ref ONLY (e.g. yjupnmbrpqeuyxgrpsrb)"
        required: true
        type: string
      pooler_host:
        description: "Session pooler host from Connect"
        required: true
        default: aws-1-ap-northeast-1.pooler.supabase.com
        type: string
      confirm:
        description: "Type RESTORE to confirm overwriting the target database"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Confirm restore
        run: |
          if [ "${{ inputs.confirm }}" != "RESTORE" ]; then
            echo "::error::Confirmation failed. Type RESTORE exactly."
            exit 1
          fi

      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: supabase-dump-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify dump file
        run: |
          ls -lh
          test -f old_project.dump || (echo "::error::old_project.dump not found in artifact" && exit 1)

      - name: Test database login
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_TARGET_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Missing secret SUPABASE_TARGET_DB_PASSWORD."
            exit 1
          fi
          PROJECT_REF="${{ inputs.target_project_ref }}"
          POOLER_HOST="${{ inputs.pooler_host }}"
          if echo "$PROJECT_REF" | grep -q '^postgres\.'; then
            echo "::error::target_project_ref must be only the ref (yjupnmbrpqeuyxgrpsrb), not postgres.<ref>"
            exit 1
          fi
          if ! echo "$PROJECT_REF" | grep -qE '^[a-z0-9]{10,40}$'; then
            echo "::error::Invalid target_project_ref: '$PROJECT_REF'"
            exit 1
          fi
          DB_USER="postgres.${PROJECT_REF}"
          PGPASSWORD="$(printf '%s' "$PGPASSWORD" | tr -d '\r\n')"
          echo "password_length=${#PGPASSWORD}"
          echo "db_user=$DB_USER"
          echo "pooler_host=$POOLER_HOST"
          # hostname:port:database:username:password
          printf '%s:5432:postgres:%s:%s\n' "$POOLER_HOST" "$DB_USER" "$PGPASSWORD" > .pgpass
          chmod 600 .pgpass
          docker run --rm \
            -v "$PWD/.pgpass:/root/.pgpass:ro" \
            -e PGPASSFILE=/root/.pgpass \
            -e PGSSLMODE=require \
            postgres:17 \
            psql -h "$POOLER_HOST" -p 5432 -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
              -c "SELECT current_user AS connected_as, current_database() AS db;"

      - name: pg_restore via PostgreSQL 17 Docker image
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_TARGET_DB_PASSWORD }}
        run: |
          PROJECT_REF="${{ inputs.target_project_ref }}"
          POOLER_HOST="${{ inputs.pooler_host }}"
          DB_USER="postgres.${PROJECT_REF}"
          PGPASSWORD="$(printf '%s' "$PGPASSWORD" | tr -d '\r\n')"
          printf '%s:5432:postgres:%s:%s\n' "$POOLER_HOST" "$DB_USER" "$PGPASSWORD" > .pgpass
          chmod 600 .pgpass
          echo "Restoring as db_user=$DB_USER pooler_host=$POOLER_HOST"
          docker run --rm \
            -v "$PWD/.pgpass:/root/.pgpass:ro" \
            -e PGPASSFILE=/root/.pgpass \
            -e PGSSLMODE=require \
            -v "$PWD:/backup" \
            -w /backup \
            postgres:17 \
            pg_restore \
              -h "$POOLER_HOST" \
              -p 5432 \
              -U "$DB_USER" \
              -d postgres \
              --no-owner \
              --no-privileges \
              --clean \
              --if-exists \
              /backup/old_project.dump
          exit_code=$?
          if [ "$exit_code" -gt 1 ]; then
            echo "::error::pg_restore failed with exit code $exit_code"
            exit "$exit_code"
          fi
          echo "pg_restore finished (exit $exit_code; 1 may mean warnings only)."
