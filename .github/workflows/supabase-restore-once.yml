# Restore old_project.dump into a Supabase database (one-off).
#
# Prerequisite: successful "Supabase DB dump (one-off)" run with artifact.
#
# Secrets (Settings → Actions):
#   SUPABASE_TARGET_DB_PASSWORD — target DB password (Database settings / reset password)
#
# Run workflow inputs:
#   target_project_ref — e.g. yjupnmbrpqeuyxgrpsrb (Dashboard → Project Settings → General)
#   pooler_host — Session pooler host from Connect, e.g. aws-1-ap-northeast-1.pooler.supabase.com
#   source_run_id — dump run ID (artifact supabase-dump-<id>)
#   confirm — type RESTORE

name: Supabase DB restore (one-off)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the successful dump job (number in Actions URL)"
        required: true
        type: string
      target_project_ref:
        description: "Target Supabase project ref (username = postgres.<ref>)"
        required: true
        type: string
      pooler_host:
        description: "Session pooler host from Connect (not the full URI)"
        required: true
        default: aws-1-ap-northeast-1.pooler.supabase.com
        type: string
      confirm:
        description: "Type RESTORE to confirm overwriting the target database"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Confirm restore
        run: |
          if [ "${{ inputs.confirm }}" != "RESTORE" ]; then
            echo "::error::Confirmation failed. Type RESTORE exactly."
            exit 1
          fi

      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: supabase-dump-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify dump file
        run: |
          ls -lh
          test -f old_project.dump || (echo "::error::old_project.dump not found in artifact" && exit 1)

      - name: pg_restore via PostgreSQL 17 Docker image
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_TARGET_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Missing secret SUPABASE_TARGET_DB_PASSWORD."
            exit 1
          fi
          PROJECT_REF="${{ inputs.target_project_ref }}"
          POOLER_HOST="${{ inputs.pooler_host }}"
          DB_USER="postgres.${PROJECT_REF}"
          if ! echo "$PROJECT_REF" | grep -qE '^[a-z0-9]{10,40}$'; then
            echo "::error::Invalid target_project_ref: '$PROJECT_REF' (use Dashboard → General → Reference ID)"
            exit 1
          fi
          echo "Connecting as user=$DB_USER host=$POOLER_HOST port=5432 database=postgres"
          docker run --rm \
            -e PGPASSWORD \
            -e PGSSLMODE=require \
            -v "$PWD:/backup" \
            -w /backup \
            postgres:17 \
            pg_restore \
              --host="$POOLER_HOST" \
              --port=5432 \
              --username="$DB_USER" \
              --dbname=postgres \
              --no-owner \
              --no-privileges \
              --clean \
              --if-exists \
              /backup/old_project.dump
          exit_code=$?
          if [ "$exit_code" -gt 1 ]; then
            echo "::error::pg_restore failed with exit code $exit_code"
            exit "$exit_code"
          fi
          echo "pg_restore finished (exit $exit_code; 1 may mean warnings only)."
