# One-off Supabase backup via GitHub Actions.
#
# Do NOT use Direct connection (db.<ref>.supabase.co) — IPv6-only; fails on
# GitHub Actions and most home networks with "Network is unreachable".
#
# Setup: Settings → Secrets → Actions → SUPABASE_DB_URL
#   Dashboard → Connect → Session pooler → URI (port 5432), e.g.:
#   postgresql://postgres.<project-ref>:PASSWORD@aws-0-<region>.pooler.supabase.com:5432/postgres
#   Username must be postgres.<ref> — plain "postgres" fails auth on the pooler.
#   (must end with /postgres — do NOT append sslmode without ?)
#
# Run: Actions → "Supabase DB dump (one-off)" → Run workflow (not "Re-run" on an old run).

name: Supabase DB dump (one-off)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: pg_dump via PostgreSQL 17 Docker image
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing secret SUPABASE_DB_URL."
            exit 1
          fi
          if echo "$SUPABASE_DB_URL" | grep -qE '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::Use Session pooler URI (port 5432), not Direct db.*.supabase.co (IPv6-only)."
            exit 1
          fi
          docker run --rm \
            -e SUPABASE_DB_URL \
            -e PGSSLMODE=require \
            -v "$PWD:/backup" \
            -w /backup \
            postgres:17 \
            pg_dump "$SUPABASE_DB_URL" \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file=/backup/old_project.dump
          docker run --rm postgres:17 pg_dump --version
          ls -lh old_project.dump

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dump-${{ github.run_id }}
          path: old_project.dump
          retention-days: 7
