# One-off Supabase backup via GitHub Actions.
#
# Do NOT use Direct connection (db.<ref>.supabase.co) — IPv6-only; fails on
# GitHub Actions and most home networks with "Network is unreachable".
#
# Setup: Settings → Secrets → Actions → SUPABASE_DB_URL
#   Dashboard → Connect → Session pooler → URI (port 5432), e.g.:
#   postgresql://postgres.<project-ref>:PASSWORD@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#
# Or enable Dedicated IPv4 and use the new Direct URI from the dashboard.
#
# Run: Actions → "Supabase DB dump (one-off)" → Run workflow → download Artifact.

name: Supabase DB dump (one-off)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate connection string host
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing secret SUPABASE_DB_URL. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if echo "$SUPABASE_DB_URL" | grep -qE '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::SUPABASE_DB_URL uses Direct host db.*.supabase.co (IPv6-only)."
            echo "Replace with Session pooler URI from Dashboard → Connect → Session pooler (port 5432),"
            echo "or enable Dedicated IPv4 and use the IPv4 Direct connection string."
            exit 1
          fi

      - name: pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=old_project.dump
          ls -lh old_project.dump

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dump-${{ github.run_id }}
          path: old_project.dump
          retention-days: 7
