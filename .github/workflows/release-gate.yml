name: Studio release gate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA from origin/main to release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: studio-release-gate
  cancel-in-progress: false

jobs:
  validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate immutable commit input
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git SHA."
            exit 1
          fi

      - name: Check out requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact commit from origin/main
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
            echo "::error::Checkout did not resolve to the requested commit."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$actual_sha" origin/main; then
            echo "::error::Release commit must be reachable from origin/main."
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

  cloud-vm-uat:
    needs: validate-commit
    runs-on: [self-hosted, linux, x64, studio-uat]
    timeout-minutes: 240
    env:
      UAT_BROWSER_DIR: ${{ vars.UAT_BROWSER_DIR }}
      UAT_INFRA_DIR: ${{ vars.UAT_INFRA_DIR }}
      UAT_INFRA_COMMIT: ${{ vars.UAT_INFRA_COMMIT }}
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          fetch-depth: 1
          clean: false
          persist-credentials: false

      - name: Verify Cloud VM runtime
        run: |
          if [[ -z "$UAT_INFRA_DIR" || ! -f "$UAT_INFRA_DIR/scripts/uat_infra.py" || ! -d "$UAT_INFRA_DIR/.git" ]]; then
            echo "::error::Set UAT_INFRA_DIR to a Git checkout of the installed uat-infra skill."
            exit 1
          fi
          if [[ ! "$UAT_INFRA_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$(git -C "$UAT_INFRA_DIR" rev-parse HEAD)" != "${UAT_INFRA_COMMIT,,}" ]]; then
            echo "::error::Set UAT_INFRA_COMMIT to the exact installed uat-infra Git commit."
            exit 1
          fi
          python3 "$UAT_INFRA_DIR/scripts/uat_infra.py" doctor \
            --config uat.infra.json \
            --profile studio-uat
          node_major="$(node --version | sed -E 's/^v([0-9]+).*/\1/')"
          if [[ "$node_major" -lt 22 ]]; then
            echo "::error::Cloud VM runner requires Node.js 22 or newer."
            exit 1
          fi
          npm ci

      - name: Run all isolated local UAT flows
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flows=(
            apt04-appointments-local
            com01-commission-local
            crm02-clients-local
            mkt01-marketing-local
            pos-packages-local
          )
          for flow in "${flows[@]}"; do
            npm run test:uat-cloud-vm -- \
              --flow "$flow" \
              --timeout 1800 \
              --report-dir "tmp/release-gate/${RELEASE_RUN_ID}/${flow}"
          done

      - name: Upload compact UAT reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-vm-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/release-gate/${{ github.run_id }}-${{ github.run_attempt }}/**/flow-report.json
          if-no-files-found: ignore
          retention-days: 7

  remote-supabase-preflight:
    needs: [validate-commit, cloud-vm-uat]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-preflight
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run audited remote read-only preflight
        env:
          RELEASE_SUPABASE_URL: ${{ secrets.RELEASE_SUPABASE_URL }}
          RELEASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_CRM01_STUDIO_ID: ${{ vars.RELEASE_CRM01_STUDIO_ID }}
          RELEASE_POS_PKG_STUDIO_ID: ${{ vars.RELEASE_POS_PKG_STUDIO_ID }}
        run: npm run verify:release-preflight

  stage-release-candidate:
    needs: [validate-commit, remote-supabase-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: release-candidate
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/vercel-cli/package-lock.json

      - name: Install application and pinned Vercel CLI dependencies
        run: |
          npm ci
          npm ci --prefix tools/vercel-cli
          npm audit --prefix tools/vercel-cli --audit-level=critical

      - name: Pull production configuration and build candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing release-candidate secret: $name"
              exit 1
            fi
          done
          vercel_cli="tools/vercel-cli/node_modules/.bin/vercel"
          "$vercel_cli" pull --yes --environment=production --token "$VERCEL_TOKEN" --no-color
          "$vercel_cli" build --prod --token "$VERCEL_TOKEN" --no-color

      - name: Deploy staged production candidate without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel_cli="tools/vercel-cli/node_modules/.bin/vercel"
          deployment_url="$("$vercel_cli" deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN" --no-color)"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel returned an invalid staged deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          "$vercel_cli" inspect "$deployment_url" --token "$VERCEL_TOKEN" --no-color

      - name: Install Chromium for candidate smoke test
        run: npx playwright install --with-deps chromium

      - name: Run read-only mobile candidate smoke test
        env:
          RELEASE_CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-commit.outputs.commit_sha }}
          RELEASE_SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release-candidate-smoke

      - name: Upload candidate smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/release-smoke/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7

  approve-and-promote-production:
    needs: [validate-commit, stage-release-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ needs.stage-release-candidate.outputs.deployment_url }}
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vercel-cli/package-lock.json

      - name: Install pinned Vercel CLI
        run: npm ci --prefix tools/vercel-cli

      - name: Promote approved candidate to production
        env:
          CANDIDATE_URL: ${{ needs.stage-release-candidate.outputs.deployment_url }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-commit.outputs.commit_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done
          if [[ ! "$CANDIDATE_URL" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Refusing to promote an invalid candidate URL."
            exit 1
          fi
          vercel_cli="tools/vercel-cli/node_modules/.bin/vercel"
          "$vercel_cli" pull --yes --environment=production --token "$VERCEL_TOKEN" --no-color
          "$vercel_cli" inspect "$CANDIDATE_URL" --token "$VERCEL_TOKEN" --no-color
          "$vercel_cli" promote "$CANDIDATE_URL" --yes --timeout=5m --token "$VERCEL_TOKEN" --no-color
          "$vercel_cli" promote status --token "$VERCEL_TOKEN" --no-color
          {
            echo "## Production promotion complete"
            echo "- Commit: \`$RELEASE_COMMIT_SHA\`"
            echo "- Approved candidate: $CANDIDATE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
