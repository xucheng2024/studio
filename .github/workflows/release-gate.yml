name: Studio release gate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA from origin/main to release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: studio-release-gate
  cancel-in-progress: false

env:
  VERCEL_CLI: tools/vercel-cli/node_modules/@vercel/vc-native-linux-x64/bin/vercel

jobs:
  validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate immutable commit input
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git SHA."
            exit 1
          fi

      - name: Check out requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact commit from origin/main
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
            echo "::error::Checkout did not resolve to the requested commit."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$actual_sha" origin/main; then
            echo "::error::Release commit must be reachable from origin/main."
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

  cloud-vm-uat:
    needs: validate-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          npm ci --prefer-offline --no-audit --fund=false

      - name: Restore Chromium browser cache
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-x64-playwright-${{ hashFiles('package-lock.json') }}

      - name: Probe cached Chromium runtime
        id: chromium-runtime
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: >-
          node --input-type=module -e 'import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true }); await browser.close();'

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true' && steps.chromium-runtime.outcome == 'failure'
        run: npx playwright install-deps chromium

      - name: Resolve Supabase cache version
        id: supabase-version
        run: >-
          node -e 'const fs = require("node:fs"); const lock = require("./package-lock.json");
          const version = lock.packages?.["node_modules/supabase"]?.version;
          if (!/^\d+\.\d+\.\d+/.test(version ?? "")) throw new Error("Missing exact Supabase CLI version");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'

      - name: Restore Supabase image cache
        id: supabase-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/github-uat/supabase-images.tar
          key: ${{ runner.os }}-x64-supabase-${{ steps.supabase-version.outputs.version }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Supabase images
        if: steps.supabase-cache.outputs.cache-hit == 'true'
        run: node scripts/cache-github-uat-images.mjs restore

      - name: Run all isolated local UAT flows
        env:
          UAT_SUPABASE_EXCLUDE: realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          POS03_HITPAY_API_KEY: ${{ secrets.POS03_HITPAY_API_KEY }}
          POS03_HITPAY_WEBHOOK_SALT: ${{ secrets.POS03_HITPAY_WEBHOOK_SALT }}
          HITPAY_API_BASE_URL: https://api.sandbox.hit-pay.com
        run: |
          flows=(
            apt01-availability-local
            apt03-calendar-local
            apt04-appointments-local
            apt04-settlement-sandbox-local
            com01-commission-local
            crm02-clients-local
            mkt01-marketing-local
            mkt02-studio-email-local
            pos02-cash-receipt-local
            pos03-hitpay-sandbox-local
            pkg01-package-ledger-local
            pos-packages-local
          )
          if [[ "${#flows[@]}" -lt 1 ]]; then
            echo "::error::Release UAT flow catalog is empty."
            exit 1
          fi
          for flow in "${flows[@]}"; do
            echo "::group::GitHub-hosted UAT ${flow}"
            node scripts/run-github-hosted-uat.mjs --flow "$flow"
            echo "::endgroup::"
          done

      - name: Upload compact UAT reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-vm-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/github-uat/**
            tmp/release-gate/**
          if-no-files-found: ignore
          retention-days: 7

  remote-supabase-preflight:
    needs: [validate-commit, cloud-vm-uat]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-preflight
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run audited remote read-only preflight
        env:
          RELEASE_SUPABASE_URL: ${{ secrets.RELEASE_SUPABASE_URL }}
          RELEASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_CRM01_STUDIO_ID: ${{ vars.RELEASE_CRM01_STUDIO_ID }}
          RELEASE_POS_PKG_STUDIO_ID: ${{ vars.RELEASE_POS_PKG_STUDIO_ID }}
        run: npm run verify:release-preflight

  stage-release-candidate:
    needs: [validate-commit, remote-supabase-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: release-candidate
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/vercel-cli/package-lock.json

      - name: Install application and pinned Vercel CLI dependencies
        run: |
          npm ci
          npm ci --ignore-scripts --prefix tools/vercel-cli
          if [[ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]]; then
            echo "::error::Release candidate requires the pinned Linux x64 Vercel CLI."
            exit 1
          fi
          if [[ ! -x "$VERCEL_CLI" ]]; then
            echo "::error::Pinned Vercel CLI binary is missing or not executable."
            exit 1
          fi
          if ! "$VERCEL_CLI" --version 2>&1 | grep -Fq "Vercel CLI 59.1.3 (native)"; then
            echo "::error::Pinned Vercel CLI version verification failed."
            exit 1
          fi
          npm audit --prefix tools/vercel-cli --audit-level=high

      - name: Pull production configuration and build candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing release-candidate secret: $name"
              exit 1
            fi
          done
          "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" --no-color
          "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN" --no-color

      - name: Deploy staged production candidate without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment_url="$("$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN" --no-color)"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel returned an invalid staged deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          "$VERCEL_CLI" inspect "$deployment_url" --token "$VERCEL_TOKEN" --no-color

      - name: Install Chromium for candidate smoke test
        run: npx playwright install --with-deps chromium

      - name: Run read-only mobile candidate smoke test
        env:
          RELEASE_CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-commit.outputs.commit_sha }}
          RELEASE_SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release-candidate-smoke

      - name: Upload candidate smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/release-smoke/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7

  approve-and-promote-production:
    needs: [validate-commit, stage-release-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ needs.stage-release-candidate.outputs.deployment_url }}
    steps:
      - name: Check out fixed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-commit.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vercel-cli/package-lock.json

      - name: Install pinned Vercel CLI
        run: |
          npm ci --ignore-scripts --prefix tools/vercel-cli
          if [[ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]]; then
            echo "::error::Production promotion requires the pinned Linux x64 Vercel CLI."
            exit 1
          fi
          if [[ ! -x "$VERCEL_CLI" ]]; then
            echo "::error::Pinned Vercel CLI binary is missing or not executable."
            exit 1
          fi
          if ! "$VERCEL_CLI" --version 2>&1 | grep -Fq "Vercel CLI 59.1.3 (native)"; then
            echo "::error::Pinned Vercel CLI version verification failed."
            exit 1
          fi
          npm audit --prefix tools/vercel-cli --audit-level=high

      - name: Promote approved candidate to production
        env:
          CANDIDATE_URL: ${{ needs.stage-release-candidate.outputs.deployment_url }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-commit.outputs.commit_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done
          if [[ ! "$CANDIDATE_URL" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Refusing to promote an invalid candidate URL."
            exit 1
          fi
          "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" --no-color
          "$VERCEL_CLI" inspect "$CANDIDATE_URL" --token "$VERCEL_TOKEN" --no-color
          "$VERCEL_CLI" promote "$CANDIDATE_URL" --yes --timeout=5m --token "$VERCEL_TOKEN" --no-color
          "$VERCEL_CLI" promote status --token "$VERCEL_TOKEN" --no-color
          {
            echo "## Production promotion complete"
            echo "- Commit: \`$RELEASE_COMMIT_SHA\`"
            echo "- Approved candidate: $CANDIDATE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
