name: Fast changed-path checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "skills/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-changed-path-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-changed-path-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: route
        run: node scripts/select-cloud-uat-flow.mjs --base "${{ github.event.before || 'HEAD~1' }}" --head "${{ github.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.route.outputs.has_fast == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.route.outputs.has_fast == 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - if: steps.route.outputs.has_fast == 'true'
        run: node scripts/select-cloud-uat-flow.mjs --base "${{ github.event.before || 'HEAD~1' }}" --head "${{ github.sha }}" --run-fast
